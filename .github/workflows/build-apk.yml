
name: Build MYTUBE APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MYTUBE_Android_*.zip'
      - '.github/workflows/build-apk.yml'

env:
  ZIP_NAME: MYTUBE_Android_2_6.zip
  APP_VERSION: "2.6"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar arquivo do projeto
        run: |
          if [ ! -f "$ZIP_NAME" ]; then
            echo "ERRO: $ZIP_NAME não encontrado."
            ls -la
            exit 1
          fi

      - name: Extrair projeto
        run: |
          mkdir -p project
          unzip -o "$ZIP_NAME" -d project

      - name: Localizar projeto Android
        run: |
          SETTINGS=$(find project -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Verificar chave de assinatura
        run: |
          KEYSTORE="$PROJECT_DIR/app/mytube-debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then
            echo "ERRO: Chave de assinatura não encontrada."
            exit 1
          fi

          echo "Chave fixa encontrada."

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Verificar APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado: $APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)

          "$APKSIGNER" verify --print-certs "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MYTUBE-${{ env.APP_VERSION }}-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
