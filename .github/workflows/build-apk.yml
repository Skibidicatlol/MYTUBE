
name: Build MYTUBE APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MYTUBE_Android_2_1.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar arquivo do projeto
        run: |
          if [ ! -f MYTUBE_Android_2_1.zip ]; then
            echo "ERRO: MYTUBE_Android_2_1.zip não encontrado."
            echo "Arquivos disponíveis:"
            ls -la
            exit 1
          fi

      - name: Extrair projeto
        run: |
          mkdir -p project
          unzip -o MYTUBE_Android_2_1.zip -d project

      - name: Localizar projeto Android
        run: |
          SETTINGS=$(find project -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: Não foi encontrado settings.gradle."
            echo "Conteúdo extraído:"
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Verificar APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: Nenhum APK foi gerado."
            exit 1
          fi

          echo "APK gerado: $APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MYTUBE-2.1-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
